<!DOCTYPE html>
<html lang="lo">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Support Requests | LaoVerse Admin</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Lao:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
</head>
<body>
    <div class="admin-layout">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-brand">
                <div class="brand-logo">L</div>
                <span style="font-size: 1.25rem; font-weight: 700;">LaoVerse Admin</span>
            </div>
            <ul class="sidebar-menu">
                <li class="menu-item">
                    <a href="index.html" class="menu-link">
                        <i class="fa-solid fa-chart-line"></i>
                        <span>Dashboard</span>
                    </a>
                </li>
                <li class="menu-item">
                    <a href="users.html" class="menu-link">
                        <i class="fa-solid fa-users"></i>
                        <span>Users Management</span>
                    </a>
                </li>
                <li class="menu-item">
                    <a href="support.html" class="menu-link active">
                        <i class="fa-solid fa-headset"></i>
                        <span>Support Requests</span>
                    </a>
                </li>
            </ul>
            <div class="sidebar-footer">
                <a href="#" id="logoutBtn" class="menu-link" style="color: #ef4444;">
                    <i class="fa-solid fa-right-from-bracket"></i>
                    <span>Logout</span>
                </a>
            </div>
        </aside>

        <div class="main-wrapper">
            <!-- Sidebar Overlay for mobile -->
            <div class="sidebar-overlay" id="sidebarOverlay"></div>
            
            <nav class="top-navbar">
                <div style="display: flex; align-items: center; gap: 1rem;">
                    <button class="menu-toggle" id="menuToggle">
                        <i class="fa-solid fa-bars"></i>
                    </button>
                    <div class="page-title">
                        <h1>Support Requests</h1>
                    </div>
                </div>
                <div class="nav-actions">
                    <div class="admin-user-profile">
                        <div class="user-text" style="text-align: right;">
                            <span id="adminName" style="display: block; font-weight: 600;">Admin</span>
                            <small style="color: var(--text-muted); font-size: 0.75rem;">Administrator</small>
                        </div>
                        <img src="images/default-profile.png" alt="Profile" class="admin-pic">
                    </div>
                </div>
            </nav>

            <main class="content-body">
                <div class="search-box">
                    <i class="fa-solid fa-magnifying-glass"></i>
                    <input type="text" id="supportSearch" placeholder="Filter by title, message, or user...">
                </div>

                <div class="section-card">
                    <div class="card-header">
                        <h2>Support Tickets</h2>
                        <div class="filter-actions">
                            <span style="font-size: 0.875rem; color: var(--text-muted);">Manage and respond to user issues</span>
                        </div>
                    </div>
                    
                    <div id="supportRequestsList" class="support-grid" style="padding: 1.5rem;">
                        <!-- Content loaded via support.js -->
                        <div style="padding: 3rem; text-align: center; color: var(--text-muted); grid-column: 1 / -1;">
                            <i class="fa-solid fa-spinner fa-spin fa-2x"></i>
                            <div style="margin-top: 1rem;">Loading support tickets...</div>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>
    <script src="js/support.js"></script>
</body>
</html>

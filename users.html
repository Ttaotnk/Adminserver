<!DOCTYPE html>
<html lang="lo">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Management | LaoVerse Admin</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Lao:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
</head>
<body>
    <div class="admin-layout">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-brand">
                <div class="brand-logo">L</div>
                <span style="font-size: 1.25rem; font-weight: 700;">LaoVerse Admin</span>
            </div>
            <ul class="sidebar-menu">
                <li class="menu-item">
                    <a href="index.html" class="menu-link">
                        <i class="fa-solid fa-chart-line"></i>
                        <span>Dashboard</span>
                    </a>
                </li>
                <li class="menu-item">
                    <a href="users.html" class="menu-link active">
                        <i class="fa-solid fa-users"></i>
                        <span>Users Management</span>
                    </a>
                </li>
                <li class="menu-item">
                    <a href="support.html" class="menu-link">
                        <i class="fa-solid fa-headset"></i>
                        <span>Support Requests</span>
                    </a>
                </li>
            </ul>
            <div class="sidebar-footer">
                <a href="#" id="logoutBtn" class="menu-link" style="color: #ef4444;">
                    <i class="fa-solid fa-right-from-bracket"></i>
                    <span>Logout</span>
                </a>
            </div>
        </aside>

        <div class="main-wrapper">
            <nav class="top-navbar">
                <div class="page-title">
                    <h1>User Management</h1>
                </div>
                <div class="nav-actions">
                    <div class="admin-user-profile">
                        <div class="user-text" style="text-align: right;">
                            <span id="adminName" style="display: block; font-weight: 600;">Admin</span>
                            <small style="color: var(--text-muted); font-size: 0.75rem;">Administrator</small>
                        </div>
                        <img src="images/default-profile.png" alt="Profile" class="admin-pic">
                    </div>
                </div>
            </nav>

            <main class="content-body">
                <div class="search-box">
                    <i class="fa-solid fa-magnifying-glass"></i>
                    <input type="text" id="userSearch" placeholder="Search by name, email, or ID...">
                </div>

                <div class="section-card">
                    <div class="card-header">
                        <h2>All Registered Users</h2>
                        <span id="userCount" style="font-size: 0.875rem; color: var(--text-muted);">Showing all users</span>
                    </div>
                    <div class="table-responsive">
                        <table class="custom-table">
                            <thead>
                                <tr>
                                    <th>Avatar</th>
                                    <th>User Info</th>
                                    <th>Email Address</th>
                                    <th class="text-center">Posts</th>
                                    <th class="text-center">Friends</th>
                                    <th>Joined Date</th>
                                </tr>
                            </thead>
                            <tbody id="userTableBody">
                                <tr>
                                    <td colspan="6" style="padding: 3rem; text-align: center; color: var(--text-muted);">
                                        <i class="fa-solid fa-spinner fa-spin fa-2x"></i>
                                        <div style="margin-top: 1rem;">Loading users...</div>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </main>
        </div>
    </div>
    <script src="js/users.js"></script>
</body>
</html>
